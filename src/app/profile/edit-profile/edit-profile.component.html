<section>
    <main>
        <div class="row">
            <div class="col-md-12">
                <form nz-form [formGroup]="profileForm">
                    <div class="row">
                        <div class="col-md-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>First
                                    Name
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your first name!">
                                    <input type="text" nz-input formControlName="frst_name"
                                        placeholder="Enter First Name" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>

                        <div class="col-md-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>Last
                                    Name
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your last name!">
                                    <input type="text" nz-input formControlName="last_name"
                                        placeholder="Enter Last Name" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>

                        <div class="col-md-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>Gender
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your gender!">
                                    <input type="text" nz-input formControlName="gender" placeholder="Enter Gender" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>


                        <div class="col-md-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>Choose Birthdate

                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your first name!">
                                    <nz-date-picker formControlName="birth_date"
                                        [nzDisabledDate]="disabledDate"></nz-date-picker>
                                    <input type="text" nz-input formControlName="birth_date"
                                        placeholder="Select Birth Date" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>

                        <div class="col-md-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>Mobile Number
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your mobile number!">
                                    <input type="text" nz-input formControlName="mobile" placeholder="Enter your Mobile Number" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>

                        <div class="col-md-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>Email
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your email!">
                                    <input type="text" nz-input formControlName="email" placeholder="Enter Email" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="d-flex justify-content-between m-3">
            <button nz-button nzType="link" class="border font-weight-semibold px-5"
           (click)="profileForm.reset()">Cancel</button>

            <button nz-button nzType="primary" class="font-weight-semibold px-5"
            routerLink="/profile/view-profile" [queryParams]="{id:'2'}">Save</button>
        </div>
    </main>
</section>
