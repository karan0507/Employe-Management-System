<div class="d-block">
    <!-- <div class="d-flex justify-content-end mb-2">
        <button nz-button nzType="primary" routerLink="/media-account/add-account">+ Add New Account </button>
    </div> -->
    <div class="row">
        <div class="col-md-12">
            <nz-card [nzLoading]="api_loader['list']">
                <div class="row">
                    <div class="col-12 col-lg-4 mb-2">
                        <div class="d-flex">
                            <nz-input-group nzSearch [nzAddOnAfter]="suffixIconButton">
                                <input type="text" nz-input placeholder="Search By Name"
                                    [(ngModel)]="_currSearchValue" (keyup.enter)="getaccountList()" />
                            </nz-input-group>
                            <ng-template #suffixIconButton>
                                <button nz-button nzType="secondary" nzSearch (click)="getTaskList()">
                                    <i nz-icon nzType="search"></i>
                                </button>
                            </ng-template>
                            <button nz-button nzType="default" class="ml-3 mb-2" nzShape="circle" (click)="resetFilter()">
                                <i nz-icon nzType="undo"></i>
                            </button>
                        </div>
                    </div>
                    <div class="col-lg-8 col-12 mb-2 d-flex flex-wrap justify-content-end">
                        <button [routerLink]="['add-account']" nz-button nzType="primary" nzSize="small" class="mr-3">
                            Add +
                        </button>
                        <button nz-button [nzType]="'link'" (click)="isFilters = true" nzSize="small"
                            class="border"
                        >
                            Filters
                        </button>
                    </div>
                </div>
                <div class="totalCount">
                    <nz-table #rowSelectionTable [nzData]="accountList" [nzTotal]="total_count" [nzFrontPagination]="false"
                        [nzShowSizeChanger]="true" [nzPageIndex]="pageIndex" [nzPageSize]="globalPageSize"
                        (nzQueryParams)="accountList[0] ? getaccountList($event) : null" [nzShowTotal]="botTotalCount"
                        [nzLoading]="api_loader['list']" [nzScroll]="{ x: '900px', y: '50vh' }">
                    <thead>
                        <tr>
                            <!-- <th nzWidth="50px">#</th> -->
                            <th nzWidth="50px">Sr. No</th>
                            <th nzWidth="200px">Link</th>
                            <th nzWidth="80px">Name</th>
                            <th nzWidth="80px">Link Type</th>
                            <th nzWidth="80px">Social Media</th>
                            <th nzWidth="50px">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ng-container *ngFor="let data of accountList; let i = index">
                            <tr>
                                <!-- <td 
                                    [nzExpand]="expandSet.has(data.id)" 
                                    (nzExpandChange)="onExpandChange(data.id, $event)"
                                ></td> -->
                                <td> {{i+1}}</td>
                                <td nzWidth="200px"> 
                                    <a [href]="data.link" target="_blank" class="p-0">{{ data?.link || '-'}}</a> 
                                </td>
                                <td nzWidth="80px">
                                    <span>
                                        {{ data?.name || '-'}}
                                    </span>
                                </td>
                                <td nzWidth="80px">
                                    <span>
                                        {{ data?.link_type || '-'}}
                                    </span>
                                </td>
                                <td nzWidth="80px">{{ data?.social_handle || '-'}}</td>
                                <td>
                                    <a class="text-dark font-size-20" nz-dropdown 
                                        [nzClickHide]="true"
                                        [nzTrigger]="'click'"
                                        [nzPlacement]="'bottomRight'"
                                        [nzDropdownMenu]="latestUploadDropDown">
                                        <i nz-icon nzType="ellipsis" nzTheme="outline"></i>
                                    </a>
                                    <nz-dropdown-menu #latestUploadDropDown="nzDropdownMenu">
                                        <ul nz-menu>
                                            <!-- <li nz-menu-item>
                                                <span class="m-l-5">View Audit</span>
                                            </li> -->
                                            <li [routerLink]="['edit-account']" [queryParams]="{id: data?.id}" nz-menu-item>
                                                <span class="m-l-5">Edit</span>
                                            </li>
                                            <!-- <li nz-menu-item>
                                                <span class="m-l-5">Delete</span>
                                            </li> -->
                                        </ul>
                                    </nz-dropdown-menu>
                                </td>
                                <!-- <td nzWidth="10rem">
                                    <button nz-button nzType="link" class="border" nzSize="small"
                                        routerLink="/media-account/edit-account" [queryParams]="{id:data?.id}">Edit</button>
                                </td> -->
                            </tr>
                            <!-- <tr [nzExpand]="expandSet.has(data.id)">
                                <span>{{ 'Audit Trail' }}</span>
                            </tr> -->
                        </ng-container>
                    </tbody>
                    </nz-table>
                    <ng-template #botTotalCount>
                        <div class="font-weight-semibold">
                            <b>{{total_count}} Results Found </b>
                        </div>
                    </ng-template>
                </div>
                

            </nz-card>
        </div>

    </div>
</div>

<section>
    <nz-drawer [nzWidth]="'350px'" [nzTitle]="'Quick View'" [nzClosable]="false" [nzVisible]="isFilters"
        nzPlacement="right" (nzOnClose)="isFilters = false"
    >
        <div class="drawer-close-icon">
            <span nz-icon nzType="close-circle" nzTheme="twotone" (click)="isFilters=false" class="cursor-pointer"></span>
        </div>
        <label>Social Media</label>
        <nz-select nzShowSearch class="selectFilter mt-2 mb-3 mr-2 w-100" nzPlaceHolder="Select Social Media" [(ngModel)]="currSocialMedia" (ngModelChange)="getaccountList()" nzAllowClear>
            <nz-option [nzValue]="'FACEBOOK'" [nzLabel]="'Facebook'">
            </nz-option>
            <nz-option [nzValue]="'TWITTER'" [nzLabel]="'Twitter'"></nz-option>
            <nz-option [nzValue]="'LINKED-IN'" [nzLabel]="' LinkedIn'">
            </nz-option>
        </nz-select>
        <label>Link Type</label>
        <nz-select nzShowSearch class="selectFilter mt-2 mb-3 mr-2 w-100" nzPlaceHolder="Select Link Type" [(ngModel)]="currLinkTpye" (ngModelChange)="getaccountList()" nzAllowClear>
            <nz-option [nzValue]="'FOR'" [nzLabel]="'For'">
            </nz-option>
            <nz-option [nzValue]="'AGAINST'" [nzLabel]="'Against'">
            </nz-option>
        </nz-select>

    </nz-drawer>
</section>
