<main>
	<section>
		<div class="d-flex justify-content-end">
			<nz-select nzPlaceHolder="Select Social Media" [(ngModel)]="_currUser" (ngModelChange)="multipleAPICall()"
				nzShowSearch nzAllowClear (nzFocus)="getSocialMedia()">
				<nz-option *ngFor="let item of userList" [nzValue]="item?.id"
					[nzLabel]="_currLanguage == 'en' ? item?.name?.en : item?.name?.hi">
				</nz-option>
			</nz-select>
		</div>
		<div class="row my-3">

			<div class="col-md-6">
				<div class="row">
					<div class="col-md-6" *ngFor="let a_data of listMatricsData; index as i">
						<!-- <nz-card >
							<div class="d-flex justify-content-center align-items-center">
								<span nz-icon nzType="logout" nzTheme="outline" style="font-size: 3rem"></span> 
								<h4 class="pl-3">Something</h4>
							</div>
					    </nz-card> -->
						<nz-card class="-flex align-items-center pointer">
							<div class="media align-items-center">
								<nz-avatar [nzSize]="60" [nzIcon]="api_calling_loader ? 'loading' : a_data.icon"
									[ngClass]="a_data.class"></nz-avatar>
								<div class="m-l-15">
									<h4 class="m-b-0">{{a_data.count}}</h4>
									<p class="m-b-0 text-dark">{{a_data.name}}</p>
								</div>
							</div>
						</nz-card>
					</div>
					<!-- Strong Followers -->
					<div class="col-md-12 h-100 mb-5">
						<nz-card nzTitle="Strong Followers" [nzLoading]="api_loader['followerList']"
							[nzExtra]="extraTemplate" style="height: 25rem; overflow: scroll;">
							<nz-list nzItemLayout="vertical">
								<nz-list-item *ngFor="let item of StrongFollowersList">
									<nz-list-item-meta>
										<nz-list-item-meta-avatar
											[nzSrc]="item?.user_details?.profile_picture ? item?.user_details?.profile_picture : 'assets/images/avatars/default.png'"
											alt></nz-list-item-meta-avatar>
										<nz-list-item-meta-avatar [nzSrc]="item.avatar"></nz-list-item-meta-avatar>
										<nz-list-item-meta-title>
											<!-- <a [routerLink]="['/posts/post-detail/',tem?.post_id]" class="text-secondary">{{ item.post_id }}</a> -->
											<div class="d-flex justify-content-start">
												<a href="{{ item.href }}">User ID - {{ item.user_details.user_id }}</a>
												<label class="ml-3">{{ item.user_details.name }}</label>
											</div>

										</nz-list-item-meta-title>
									</nz-list-item-meta>

									<ul nz-list-item-actions>
										<nz-list-item-action>
											<span nz-icon nzType="like" style="margin-right: 8px;"></span>
											{{item.total_likes}}
										</nz-list-item-action>
										<nz-list-item-action>
											<span nz-icon nzType="comment" style="margin-right: 8px;"></span>
											{{item.total_comments}}
										</nz-list-item-action>
										<nz-list-item-action>
											<span nz-icon nzType="share-alt" style="margin-right: 8px;"></span>
											{{item.total_shares}}
										</nz-list-item-action>
										<nz-list-item-action>
											<span nz-icon nzType="share-alt" style="margin-right: 8px;"></span>
											{{item.total_shares}}
										</nz-list-item-action>
									</ul>
									<nz-list-item-extra>
									</nz-list-item-extra>
								</nz-list-item>
							</nz-list>

						</nz-card>
						<nz-pagination [nzPageIndex]="followerPage" [nzTotal]="followerPageSize"
							(nzPageIndexChange)="getFollowerList($event,'pageIndex')"
							(nzPageSizeChange)="getFollowerList($event,'')"></nz-pagination>
						<ng-template #extraTemplate>
							<a>View All</a>
						</ng-template>
					</div>
				</div>
			</div>

			<!-- Latest Posts -->
			<div class="col-md-6 h-100 b-5">
				<nz-card nzTitle="Latest Posts" [nzLoading]="api_loader['postList']" [nzExtra]="extraTemplate"
					style="height: 100vh; overflow: scroll;">
					<nz-list nzItemLayout="vertical">
						<nz-list-item *ngFor="let item of LatestPostDataSet">
							<div class="d-flex flex-column">
								<div class="d-flex flex-column justify-content-center align-items-center mx-auto my-2">
									<img style="width: 100px; height: 80px;" class="post_image_style mx-auto" alt="logo"
										[src]="item.image" />
									<!-- <button nz-button nz-button></button> -->
								</div>
								<div class="d-flex justify-content-between flex-wrap">

									<div class="d-flex flex-column">
										<div class="d-flex">
											<nz-avatar
												[nzSrc]="item?.social_user?.profile_picture ? item?.social_user?.profile_picture : 'assets/images/avatars/default.png'">

											</nz-avatar>
											<div class="mx-3">
												<a [routerLink]="['/posts/post-detail/']"
													[queryParams]="{post_id:item?.post_id}" class="text-secondary ">{{
													item.post_id }}</a>
												<label for="" class="text-muted mx-3 font-size-12">{{ item.post_on |
													date: 'medium'}}</label>

											</div>
										</div>
										<p class="m-3">
											{{ item.title }}
										</p>


									</div>
									<!-- <div class="d-lg-flex d-none flex-column">
										<img style="width: 100px; height: 80px;" class="post_image_style mx-auto" alt="logo"
											[src]="item.image" />
										
									</div> -->
								</div>
								<ul nz-list-item-actions>
									<nz-list-item-action>
										<span nz-icon nzType="like" style="margin-right: 8px;"></span>
										{{item.total_likes}}
									</nz-list-item-action>
									<nz-list-item-action>
										<span nz-icon nzType="comment" style="margin-right: 8px;"></span>
										{{item.total_comments}}
									</nz-list-item-action>
									<nz-list-item-action>
										<span nz-icon nzType="share-alt" style="margin-right: 8px;"></span>
										{{item.total_shares}}
									</nz-list-item-action>
									<nz-list-item-action>
										<span nz-icon (click)="openFacebook(item.post_url)" nzType="facebook"
											style="margin-right: 8px;"></span>

									</nz-list-item-action>
								</ul>
							</div>
							<!-- <nz-list-item-meta>
								<nz-list-item-meta-avatar
									[nzSrc]="item?.social_user?.profile_picture ? item?.social_user?.profile_picture : 'assets/images/avatars/default.png'"
									alt></nz-list-item-meta-avatar>
								<nz-list-item-meta-title>
									<a [routerLink]="['/posts/post-detail/']" [queryParams]="{post_id:item?.post_id}"
										class="text-secondary">{{ item.post_id }}</a>
									[queryParams]="{id:item?.id}"
								</nz-list-item-meta-title>
								<nz-list-item-meta-description>
									{{ item.post_on | date: 'medium'}}
								</nz-list-item-meta-description>
							</nz-list-item-meta>
							{{ item.title }}
							<ul nz-list-item-actions>
								<nz-list-item-action>
									<span nz-icon nzType="like" style="margin-right: 8px;"></span>
									{{item.total_likes}}
								</nz-list-item-action>
								<nz-list-item-action>
									<span nz-icon nzType="comment" style="margin-right: 8px;"></span>
									{{item.total_comments}}
								</nz-list-item-action>
								<nz-list-item-action>
									<span nz-icon nzType="share-alt" style="margin-right: 8px;"></span>
									{{item.total_shares}}
								</nz-list-item-action>
								<nz-list-item-action>
									<span nz-icon (click)="openFacebook(item.post_url)" nzType="facebook"
										style="margin-right: 8px;"></span>

								</nz-list-item-action> -->
							<!-- </ul> -->
							<nz-list-item-extra class="d-none">
								<div class="d-flex flex-column">
									<img style="width: 100px; height: 80px;" class="post_image_style" alt="logo"
										[src]="item.image" />
									<!-- <button nz-button nz-button></button> -->
								</div>
								<!-- <nz-list-item-meta-avatar [nzSrc]="item?.image ? item?.image : 'assets/images/avatars/default.png'" alt></nz-list-item-meta-avatar> -->
							</nz-list-item-extra>
						</nz-list-item>
					</nz-list>
				</nz-card>
				<ng-template #extraTemplate>
					<a>View All</a>
				</ng-template>
				<nz-pagination [nzPageIndex]="postPage" [nzTotal]="postPageSize"
					(nzPageIndexChange)="getPostList($event,'pageIndex')"
					(nzPageSizeChange)="getPostList($event,'')"></nz-pagination>
			</div>


		</div>
	</section>
</main>
