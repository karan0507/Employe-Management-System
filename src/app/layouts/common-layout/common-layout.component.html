<div class="common-layout {{ 'is-' + selectedHeaderColor }}" [ngClass]="{
        'is-folded': isFolded,
        'is-side-nav-dark' : isSideNavDark,
        'is-expand' : isExpand
    }">
    <!-- <app-header></app-header> -->
    <!-- <app-sidenav></app-sidenav> -->
    <div class="page-container">
        <div class="bg-white main-content h-unset p-3 cardBorder"
            [ngClass]="!showBreadCrumb ? 'd-flex align-items-center' : ''" *ngIf="contentHeaderDisplay !== 'none'">
            <div class="main-content-header d-flex justify-content-between mb-0 py-2 flex-wrap" *ngIf="showBreadCrumb">
                <div class="d-flex flex-wrap align-items-center">
                    <div class="d-flex justify-content-start align-items-center" *ngIf="_currHeaderData?.isHome">
                        <!-- <img src="../../../assets/images/Ext_Images/Ellipse 1201cng_log.svg" alt="" height="50px"
                            class="h-auto mr-3">
                        <h6>MLA Devendra Yadav</h6> -->
                    </div>
                    <span *ngIf="_currHeaderData?.isButton && !(_currHeaderData?.isHome)"
                        [routerLink]="_currHeaderData?.url" class="font-size-18 mr-3 text-dark" nz-icon
                        nzType="arrow-left" nzTheme="outline"></span>
                    <h5 class="page-title mb-0 mr-2 text-dark"
                        *ngIf="!(_currHeaderData?.isHome) && breadcrumbs$ | async; let breadcrumbs">{{showBreadCrumb}}
                    </h5>
                    <nz-breadcrumb>
                        <span *ngIf="isSlash">/</span>
                        <nz-breadcrumb-item class="pl-2" *ngFor="let breadcrumb of breadcrumbs$ | async">
                            <a [routerLink]="breadcrumb.url" [queryParams]="breadcrumb.params">
                                {{ breadcrumb.label }}
                            </a>
                        </nz-breadcrumb-item>
                    </nz-breadcrumb>
                </div>
            </div>

            <div *ngIf="router.url.includes('dashboard')">
                <h4 class="font-weight-semibold" *ngIf="breadcrumbs$ | async; let breadcrumbs">
                    {{(breadcrumbs[breadcrumbs.length - 1].label)}}</h4>
            </div>
            <h4 class="font-weight-semibold d-none" [ngClass]="showBreadCrumb ? 'mt-4' : ''"
                *ngIf="breadcrumbs$ | async; let breadcrumbs">{{(breadcrumbs[breadcrumbs.length - 1]?.label)}}</h4>
        </div>
        <div class="main-content p-4" [ngClass]="contentHeaderDisplay !== 'none' ? 'pt-3' : ''">
            <router-outlet></router-outlet>
        </div>
        <app-footer></app-footer>
    </div>
</div>
