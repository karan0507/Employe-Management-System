<section>
    <main>
        <div class="row">
            <div class="col-md-12">
                <form nz-form [formGroup]="profileForm">
                    <div class="row">
                        <div class="col-lg-6 col-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left">{{_currLanguage == 'en' ?
                                    'Full Name' : 'पूरा नाम'}}
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24"
                                    [nzErrorTip]="_currLanguage == 'en' ? 'Please enter your first name' : 'कृपया अपना पूरा नाम दें'">
                                    <input type="text" nz-input formControlName="name"
                                        [placeholder]="_currLanguage == 'en' ? 'Full Name' : 'पूरा नाम'" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>

                        <div class="col-lg-6 col-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>{{_currLanguage ==
                                    'en' ?
                                    'Mobile' : 'गतिमान'}}
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24"
                                    [nzErrorTip]="_currLanguage == 'en' ? 'Please enter your Mobile' : 'कृपया अपना गतिमान दर्ज करें'">
                                    <input type="text" nz-input formControlName="mobile"
                                        [placeholder]="_currLanguage == 'en' ? 'Mobile' : 'गतिमान'" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>

                        <div class="col-lg-6 col-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>Email
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your email!">
                                    <input type="text" nz-input formControlName="email" placeholder="Enter Email" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>

                        <div class="col-lg-6 col-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>{{_currLanguage ==
                                    'en' ?
                                    'Designation' : 'पद'}}
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24"
                                    [nzErrorTip]="_currLanguage == 'en' ? 'Please enter Designation' : 'कृपया पद का प्रकार चुनें'">
                                    <input type="text" nz-input formControlName="designation"
                                        [placeholder]="_currLanguage == 'en' ? 'Enter Designation' : 'कृपया पद का प्रकार चुनें'" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>

                        <div class="col-lg-6 col-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>About Party
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your about!">
                                    <textarea rows="4" nz-input formControlName="about"
                                        placeholder="Enter About Party"></textarea>
                                </nz-form-control>
                            </nz-form-item>
                        </div>


                        <div class="col-lg-6 col-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>Party Info
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your party info!">
                                    <textarea rows="4" nz-input formControlName="party_info"
                                        placeholder="Enter Party Info"></textarea>
                                </nz-form-control>
                            </nz-form-item>
                        </div>


                        <div class="col-lg-6 col-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>Party Name
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your party name!">
                                    <input type="text" nz-input formControlName="designation"
                                        [placeholder]="_currLanguage == 'en' ? 'Enter Party Name' : 'कृपया पद का प्रकार चुनें'" />
                                </nz-form-control>
                            </nz-form-item>
                        </div>


                        <div class="col-lg-6 col-12">
                            <nz-form-item>
                                <nz-form-label [nzSm]="8" [nzXs]="24" class=" text-left" nzRequired>State
                                </nz-form-label>
                                <nz-form-control [nzSm]="16" [nzXs]="24" nzErrorTip="Please check your State!">
                                    <nz-select nzPlaceHolder="Select State" formControlName="state"
                                        nzShowSearch nzAllowClear (nzFocus)="getStateList()">
                                        <nz-option *ngFor="let item of stateList" [nzValue]="item?.id"
                                            [nzLabel]="_currLanguage == 'en' ? item?.name?.en : item?.name?.hi">
                                        </nz-option>
                                    </nz-select>
                                </nz-form-control>
                            </nz-form-item>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <div class="d-flex justify-content-end m-5">
            <button nz-button nzType="link" class="border font-weight-semibold mx-5 px-5"
                (click)="profileForm.reset()" routerLink="/profile/view-profile">Cancel</button>

            <button nz-button nzType="primary" [nzLoading]="api_loader['button']"
             [disabled]="profileForm.invalid ? true : false" class="font-weight-semibold px-5" (click)="submitProfile()">Save</button>
        </div>
    </main>
</section>
