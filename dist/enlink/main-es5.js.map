<footer class="footer">
    <div class="footer-content justify-content-between w-100">
        <!-- <ul nz-menu nzMode="horizontal" class="d-flex justify-content-between w-100" style="border: 0 !important;">
            <li nz-menu-item> <span nz-icon nzType="audit"   nzTheme="outline" class="font-size-22"></span></li>
            <li nz-menu-item><span nz-icon nzType="calendar"  nzTheme="outline" class="font-size-22"></span></li>
           
            <li nz-menu-item> <span nz-icon nzType="fund-view"   nzTheme="outline" class="font-size-22"></span></li>
            <li nz-menu-item><span nz-icon nzType="more"  nzTheme="outline" class="font-size-22"></span></li>
           
            
        </ul> -->


        <!-- <nz-segmented [nzOptions]="options" [nzBlock]="true">

        </nz-segmented> -->

        <nz-radio-group class="d-flex justify-content-between w-100" [(ngModel)]="radioValue" (ngModelChange)="changeAppNav()">

            <div nz-radio-button style="border: 0;" [nzValue]="'voter'">
                <div class="d-flex flex-column" style="font: small-caption;">
                    <span nz-icon nzType="audit" nzTheme="outline" class="font-size-22"></span>
                    <label class="font-size-12 mt-2">Voters</label>
                </div>
            </div>
            <div nz-radio-button style="border: 0;" [nzValue]="'task-management'">
                <div class="d-flex flex-column" style="font: small-caption;">
                    <span nz-icon nzType="schedule" nzTheme="outline" class="font-size-22"></span>
                    <label class="font-size-12 mt-2">Tasks</label>
                </div>
            </div>
            <div nz-radio-button style="border: 0;" [nzValue]="'reconciliation'">
                <div class="d-flex flex-column" style="font: small-caption;">
                    <span nz-icon nzType="reconciliation" nzTheme="outline" class="font-size-22"></span>
                    <label class="font-size-12 mt-2">Reports</label>
                </div>
            </div>
            <div nz-radio-button style="border: 0;" [nzValue]="'profile'">
                <div class="d-flex flex-column" style="font: small-caption;">
                    <span nz-icon nzType="more" nzTheme="outline" class="font-size-22"></span>
                    <label class="font-size-12 mt-2">More</label>
                </div>
            </div>
        </nz-radio-group>
    </div>
</footer>
