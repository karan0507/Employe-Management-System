<section>
  <div class="row">
    <div class="col-lg-4 col-6"  *ngFor="let item of attributeList; let i = index">
        <nz-card [nzTitle]="adAttribute">
            <ng-template #adAttribute>
                <div class="d-flex align-items-center flex-wrap w-100">
                    <h6 class="mr-5">{{_currLanguage == 'en' ? item?.primary_attribute?.name?.en :
                        item?.primary_attribute?.name?.hi}}</h6>
                    <nz-select [(ngModel)]="item._currTagValue" nzPlaceHolder="Enter Relationship" class="selectFilter mr-2" nzShowSearch nzAllowClear
                        (nzFocus)="getTagLIst(item?.id)" (keyup)="test($event,i)">
                        <nz-option *ngFor="let item of tagsList" [nzValue]="item?.name?.en ? item?.name?.en : item?.name?.hi"
                            [nzLabel]="_currLanguage == 'en' ? item?.name?.en : item?.name?.hi">
                        </nz-option>
                    </nz-select>
                    <span nz-icon nzType="plus-circle" nzTheme="outline" (click)="addTagForAttribute(item)"></span>
                </div>
            </ng-template>
            
            <div class="d-flex flex-wrap align-items-center">
                <nz-table #rowSelectionTable [nzData]="attributeList"
                [nzFrontPagination]="false" [nzShowSizeChanger]="false" [nzScroll]="{ x: '1500px', y: '50vh' }">
                <thead>
                    <tr>
                        <th nzWidth="3rem">Sr No.</th>
                        <th nzWidth="14rem">Name</th>
                        <!-- <th>Response Type</th>
                <th>Action Type</th> -->
                        <th>Re-Share</th>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngFor="let data of attributeList; let i = index">
                        <tr>
                            <td>{{i+1}}</td>
                            <td>{{ _currLanguage == "en" ?  data?.tag?.name?.en : data?.tag?.name?.en }}</td>
                            <!-- <td{ data.r>{esponse_type }}</td>
                        <td>{{ data.user_details.user_id }}</td> -->
                            <td>0</td>
                        </tr>
                       
                    </ng-container>
                </tbody>
            </nz-table>
                <!-- <nz-tag *ngFor="let tag of item?.tags; let i = index">
                    {{  tag ? (_currLanguage == "en" ?  tag?.name?.en : tag?.name?.hi): "" }}
                </nz-tag> -->
                <!-- <nz-tag [nzColor]="'purple'" nf>
                    {{_currLanguage == 'en' ? item?.tag?.name?.en :
                        item?.tag?.name?.hi}}
                </nz-tag> -->
            </div>
        </nz-card>
    </div>
  </div>
</section>
